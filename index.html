<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LORCA Orca Runner 3D | LethalOrca</title>
<style>
  :root{
    --abyss:#010712;
    --panel:#061024;
    --panel2:#0a1836;
    --teal:#00f2fe;
    --gold:#ffb703;
    --danger:#ff0055;
    --text:#f0f6fc;
    --muted:#546e7a;
    --line:rgba(0,242,254,0.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--abyss); font-family:'Segoe UI',system-ui,sans-serif; color:var(--text);}
  #canvasWrap{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%;}

  /* HUD */
  #hud{position:fixed; top:0; left:0; right:0; padding:16px 24px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:20; font-family:'Consolas',monospace;}
  .hud-pill{background:rgba(6,16,36,0.85); border:1px solid var(--line); border-radius:14px; padding:10px 18px; backdrop-filter:blur(10px); box-shadow:0 0 25px rgba(0,242,254,0.2);}
  .balance-row{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; color:var(--gold);}
  .balance-row .coin-dot{width:14px; height:14px; border-radius:50%; background:radial-gradient(circle, #fff, var(--gold)); box-shadow:0 0 12px var(--gold);}
  #levelBadge{font-size:13px; font-weight:800; color:var(--teal); border:1px solid var(--teal); padding:4px 14px; border-radius:999px; background:rgba(0,242,254,0.12);}

  /* Overlays */
  .overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, rgba(6,16,36,0.75), rgba(1,7,18,0.98)); backdrop-filter:blur(8px);}
  .hidden{display:none !important;}
  .panel{width:min(460px, 92vw); background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius:24px; padding:32px; box-shadow:0 0 60px rgba(0,242,254,0.25);}
  .brand{text-align:center; margin-bottom:16px;}
  .brand .title{font-size:30px; font-weight:900; letter-spacing:1.5px; background:linear-gradient(90deg, var(--teal), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .orca-emblem{width:86px; height:86px; margin:12px auto; display:flex; align-items:center; justify-content:center; border-radius:50%; background:radial-gradient(circle, rgba(0,242,254,0.2), #010712); border:2px solid var(--teal); font-size:46px; box-shadow:0 0 25px rgba(0,242,254,0.4);}

  .menu-btn{display:flex; align-items:center; justify-content:space-between; width:100%; padding:16px 20px; margin-top:12px; border-radius:16px; border:1px solid var(--line); background:rgba(0,242,254,0.05); color:var(--text); font-size:16px; font-weight:800; cursor:pointer; transition:0.25s;}
  .menu-btn:hover{border-color:var(--teal); background:rgba(0,242,254,0.2); transform:translateY(-2px); box-shadow:0 0 20px rgba(0,242,254,0.3);}
  .menu-btn.primary{background:linear-gradient(90deg, #00f2fe, #0072ff); color:#010712; border:none; box-shadow:0 0 30px rgba(0,242,254,0.5);}

  #pauseBtn{position:fixed; top:18px; right:18px; z-index:22; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:rgba(6,16,36,0.85); color:var(--teal); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #touchZone{position:fixed; inset:0; z-index:15; touch-action:none;}
</style>
</head>
<body>

<div id="canvasWrap"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-pill">
    <div class="balance-row"><span class="coin-dot"></span><span id="hudBalance">0</span> LORCA</div>
  </div>
  <div class="hud-pill" style="text-align:right;">
    <div id="levelBadge">LEVEL <span id="hudLevel">1</span></div>
    <div style="font-size:12px; color:var(--muted); margin-top:4px;"><span id="hudDistance">0</span>m</div>
  </div>
</div>

<button id="pauseBtn" class="hidden">❚❚</button>

<div id="touchZone" class="hidden"></div>

<!-- MENU -->
<div id="menuOverlay" class="overlay">
  <div class="panel">
    <div class="brand">
      <div class="orca-emblem">🐋</div>
      <div class="title">LETHAL ORCA 3D</div>
      <div style="font-size:12px; color:var(--muted); letter-spacing:2px; text-transform:uppercase;">Ocean Horizon P2E Runner</div>
    </div>
    <button class="menu-btn primary" onclick="UI.startGame()">▶ START OCEAN RUN</button>
    <button class="menu-btn" onclick="UI.connectWallet()">👛 CONNECT PHANTOM</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameoverOverlay" class="overlay hidden">
  <div class="panel" style="text-align:center;">
    <div class="brand"><div class="title" style="font-size:26px; color:var(--danger);">RUN TERMINATED</div></div>
    <div style="display:flex; justify-content:space-around; margin:24px 0;">
      <div><div style="font-size:26px; font-weight:900; color:var(--gold);" id="goCoins">0</div><div style="font-size:12px; color:var(--muted);">LORCA</div></div>
      <div><div style="font-size:26px; font-weight:900; color:var(--teal);" id="goDistance">0m</div><div style="font-size:12px; color:var(--muted);">DISTANCE</div></div>
    </div>
    <button class="menu-btn primary" onclick="UI.startGame()">▶ RE-ENTER OCEAN</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CONFIG = {
  lanes: [-2.6, 0, 2.6],
  baseSpeed: 18,
  jumpForce: 17,
  gravity: -42,
  spawnBase: 0.7
};

const STATE = {
  running:false, paused:false, lane:1, x:0, y:0, vy:0, grounded:true,
  distance:0, level:1, balance:0, speed:CONFIG.baseSpeed, spawnTimer:0,
  obstacles:[], coins:[], particles:[], wallet:null
};

let scene, camera, renderer, clock, orca, tailFin, leftFin, rightFin;

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010712);
  scene.fog = new THREE.FogExp2(0x010712, 0.015);

  // Wide Horizontal Camera Perspective
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 300);
  camera.position.set(0, 5, -10);

  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.getElementById('canvasWrap').appendChild(renderer.domElement);

  // Cyber Lights
  scene.add(new THREE.AmbientLight(0x0a2540, 1.8));
  
  const mainLight = new THREE.DirectionalLight(0x00f2fe, 3);
  mainLight.position.set(-15, 35, -15);
  mainLight.castShadow = true;
  scene.add(mainLight);

  const glowLight = new THREE.PointLight(0xffb703, 2, 40);
  glowLight.position.set(0, 6, 12);
  scene.add(glowLight);

  buildOceanTrack();
  build3DOrca();

  window.addEventListener('resize', onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function buildOceanTrack(){
  const trackGeo = new THREE.PlaneGeometry(18, 500);
  const trackMat = new THREE.MeshStandardMaterial({color:0x03122b, roughness:0.1, metalness:0.9});
  const track = new THREE.Mesh(trackGeo, trackMat);
  track.rotation.x = -Math.PI/2;
  track.position.z = 200;
  track.receiveShadow = true;
  scene.add(track);

  CONFIG.lanes.forEach(lx => {
    const lineGeo = new THREE.PlaneGeometry(0.1, 500);
    const lineMat = new THREE.MeshBasicMaterial({color:0x00f2fe});
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI/2;
    line.position.set(lx, 0.02, 200);
    scene.add(line);
  });
}

function build3DOrca(){
  orca = new THREE.Group();

  const blackMat = new THREE.MeshStandardMaterial({color:0x050508, roughness:0.1, metalness:0.4});
  const whiteMat = new THREE.MeshStandardMaterial({color:0xf0f6fc, roughness:0.2});

  const bodyGeo = new THREE.ConeGeometry(0.8, 3.4, 20);
  bodyGeo.rotateX(Math.PI/2);
  const body = new THREE.Mesh(bodyGeo, blackMat);
  body.scale.set(1, 0.7, 1);
  body.castShadow = true;
  orca.add(body);

  const bellyGeo = new THREE.SphereGeometry(0.7, 16, 16);
  const belly = new THREE.Mesh(bellyGeo, whiteMat);
  belly.scale.set(0.8, 0.4, 1.8);
  belly.position.set(0, -0.2, 0);
  orca.add(belly);

  [-0.48, 0.48].forEach(x => {
    const patch = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), whiteMat);
    patch.scale.set(0.3, 0.6, 1.2);
    patch.position.set(x, 0.25, 0.6);
    orca.add(patch);
  });

  const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.3, 8), blackMat);
  dorsal.rotation.x = -0.4;
  dorsal.position.set(0, 0.85, -0.2);
  orca.add(dorsal);

  const finGeo = new THREE.BoxGeometry(0.9, 0.08, 0.4);
  leftFin = new THREE.Mesh(finGeo, blackMat);
  leftFin.position.set(-0.75, -0.1, 0.2);
  orca.add(leftFin);

  rightFin = new THREE.Mesh(finGeo, blackMat);
  rightFin.position.set(0.75, -0.1, 0.2);
  orca.add(rightFin);

  tailFin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.06, 0.5), blackMat);
  tailFin.position.set(0, 0, -1.7);
  orca.add(tailFin);

  orca.position.set(0, 0.6, 0);
  scene.add(orca);
}

function spawnObstacle(){
  const lane = CONFIG.lanes[Math.floor(Math.random()*3)];
  const obstacle = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.2, 0.8),
    new THREE.MeshStandardMaterial({color:0xff0055, emissive:0xaa0033, roughness:0.2})
  );
  obstacle.position.set(lane, 0.6, STATE.distance + 60);
  obstacle.castShadow = true;
  scene.add(obstacle);
  STATE.obstacles.push(obstacle);
}

function spawnCoin(){
  const lane = CONFIG.lanes[Math.floor(Math.random()*3)];
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 0.1, 20),
    new THREE.MeshStandardMaterial({color:0xffb703, metalness:0.9, roughness:0.1, emissive:0xff8800, emissiveIntensity:0.5})
  );
  coin.rotation.x = Math.PI/2;
  coin.position.set(lane, 1.2, STATE.distance + 60);
  scene.add(coin);
  STATE.coins.push(coin);
}

function changeLane(dir){
  STATE.lane = Math.min(2, Math.max(0, STATE.lane + dir));
}

function doJump(){
  if(STATE.grounded){
    STATE.vy = CONFIG.jumpForce;
    STATE.grounded = false;
  }
}

window.addEventListener('keydown', e => {
  if(!STATE.running || STATE.paused) return;
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
  if(e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
  if(e.code === 'ArrowUp' || e.code === 'Space') doJump();
});

clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(STATE.running && !STATE.paused){
    updateGame(dt);
  }

  renderer.render(scene, camera);
}

function updateGame(dt){
  STATE.distance += STATE.speed * dt;

  const targetX = CONFIG.lanes[STATE.lane];
  STATE.x += (targetX - STATE.x) * Math.min(1, dt * 12);

  if(!STATE.grounded){
    STATE.vy += CONFIG.gravity * dt;
    STATE.y += STATE.vy * dt;
    if(STATE.y <= 0){ STATE.y = 0; STATE.vy = 0; STATE.grounded = true; }
  }

  orca.position.set(STATE.x, STATE.y + 0.6, STATE.distance);
  const swimTime = performance.now() * 0.009;
  
  orca.rotation.z = (targetX - STATE.x) * -0.22;
  orca.rotation.x = STATE.vy * 0.03;
  tailFin.rotation.y = Math.sin(swimTime * 2) * 0.45;

  camera.position.set(STATE.x * 0.35, 5 + STATE.y * 0.2, STATE.distance - 10);
  camera.lookAt(STATE.x * 0.35, 1.4 + STATE.y * 0.3, STATE.distance + 12);

  STATE.spawnTimer += dt;
  if(STATE.spawnTimer > CONFIG.spawnBase){
    STATE.spawnTimer = 0;
    if(Math.random() < 0.6) spawnCoin();
    else spawnObstacle();
  }

  for(let i = STATE.obstacles.length-1; i>=0; i--){
    const o = STATE.obstacles[i];
    if(o.position.z < STATE.distance - 6){ scene.remove(o); STATE.obstacles.splice(i,1); continue; }
    if(Math.abs(o.position.z - orca.position.z) < 0.8 && Math.abs(o.position.x - orca.position.x) < 0.9 && STATE.y < 0.8){
      endRun(); return;
    }
  }

  for(let i = STATE.coins.length-1; i>=0; i--){
    const c = STATE.coins[i];
    c.rotation.z += dt * 5;
    if(c.position.z < STATE.distance - 6){ scene.remove(c); STATE.coins.splice(i,1); continue; }
    if(Math.abs(c.position.z - orca.position.z) < 1.0 && Math.abs(c.position.x - orca.position.x) < 0.9){
      STATE.balance += 50;
      scene.remove(c); STATE.coins.splice(i,1);
      updateHud();
    }
  }

  updateHud();
}

function updateHud(){
  document.getElementById('hudBalance').textContent = STATE.balance;
  document.getElementById('hudDistance').textContent = Math.floor(STATE.distance);
}

function endRun(){
  STATE.running = false;
  document.getElementById('goCoins').textContent = STATE.balance;
  document.getElementById('goDistance').textContent = Math.floor(STATE.distance) + 'm';
  UI.hideAll();
  document.getElementById('gameoverOverlay').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
}

const UI = {
  overlays:['menuOverlay','gameoverOverlay'],
  hideAll(){ this.overlays.forEach(id => document.getElementById(id).classList.add('hidden')); },
  startGame(){
    this.hideAll();
    STATE.obstacles.forEach(o => scene.remove(o));
    STATE.coins.forEach(c => scene.remove(c));
    STATE.obstacles = []; STATE.coins = [];
    STATE.distance = 0; STATE.balance = 0; STATE.lane = 1; STATE.x = 0; STATE.y = 0;
    STATE.running = true;
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('pauseBtn').classList.remove('hidden');
  },
  async connectWallet(){
    if(window.solana && window.solana.isPhantom){
      const resp = await window.solana.connect();
      STATE.wallet = resp.publicKey.toString();
      alert('Connected: ' + STATE.wallet);
    } else alert('Phantom Wallet not detected!');
  }
};

initThree();
animate();
</script>
</body>
</html>
