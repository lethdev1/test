<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LORCA 3D Ultra | LethalOrca</title>
<style>
  :root {
    --bg: #030712;
    --primary: #00f2fe;
    --accent: #4facfe;
    --gold: #ffb703;
    --danger: #ff0055;
    --glass: rgba(10, 25, 47, 0.75);
    --border: rgba(0, 242, 254, 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff; }
  
  #canvas-container { position: absolute; inset: 0; z-index: 1; }
  
  /* Modern Glassmorphic HUD */
  #hud {
    position: absolute; top: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10; pointer-events: none;
  }
  .hud-card {
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 12px 24px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }
  .hud-val { font-size: 24px; font-weight: 800; font-family: monospace; color: var(--primary); text-shadow: 0 0 10px rgba(0,242,254,0.5); }
  .hud-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #8892b0; margin-bottom: 2px; }

  /* Overlay Panels */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; justify-content: center; align-items: center;
    background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px);
    transition: opacity 0.4s ease;
  }
  .panel {
    width: 90%; max-width: 440px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 24px; padding: 40px 30px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,242,254,0.1);
  }
  .title {
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle { font-size: 13px; color: #8892b0; margin-bottom: 30px; letter-spacing: 1px; }
  
  .btn {
    width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
    color: #030712; box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6); }
  .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); box-shadow: none; }
  .btn-secondary:hover { background: rgba(0,242,254,0.1); }
  
  .hidden { display: none !important; opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-card">
    <div class="hud-lbl">ORCA TOKENS</div>
    <div class="hud-val" id="scoreVal">0</div>
  </div>
  <div class="hud-card" style="text-align: right;">
    <div class="hud-lbl">DISTANCE</div>
    <div class="hud-val" id="distVal" style="color: var(--gold);">0m</div>
  </div>
</div>

<!-- START MENU -->
<div id="startOverlay" class="overlay">
  <div class="panel">
    <div class="title">LETHAL ORCA</div>
    <div class="subtitle">NEXT-GEN HIGH-SPEED OCEAN RUNNER</div>
    <button class="btn" onclick="Game.start()">START EXPERIENCE</button>
  </div>
</div>

<!-- GAME OVER MENU -->
<div id="gameOverOverlay" class="overlay hidden">
  <div class="panel">
    <div class="title" style="color: var(--danger); -webkit-text-fill-color: initial;">CRASHED</div>
    <div class="subtitle" id="finalStats">Distance: 0m | Tokens: 0</div>
    <button class="btn" onclick="Game.start()">TRY AGAIN</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- GAME ENGINE ---
const Game = {
  active: false,
  score: 0,
  distance: 0,
  speed: 0.7,
  lane: 0, // -1: Left, 0: Center, 1: Right
  targetX: 0,
  posY: 0,
  isJumping: false,
  jumpVelocity: 0,
  
  init() {
    this.setupScene();
    this.createLights();
    this.createWater();
    this.createOrca();
    this.bindEvents();
    this.animate();
  },

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x030712);
    this.scene.fog = new THREE.FogExp2(0x030712, 0.015);

    // Dynamic Camera Setup
    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(0, 6, 14);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.2;
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);

    this.obstacles = [];
    this.coins = [];
    this.particles = [];
  },

  createLights() {
    const ambient = new THREE.AmbientLight(0x0a2540, 1.5);
    this.scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0x00f2fe, 2.5);
    dirLight.position.set(20, 40, -20);
    this.scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x4facfe, 3, 50);
    pointLight.position.set(0, 5, 5);
    this.scene.add(pointLight);
  },

  createWater() {
    // Endless Water Track
    const geo = new THREE.PlaneGeometry(100, 400, 64, 64);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x021027,
      roughness: 0.1,
      metalness: 0.8,
      wireframe: false
    });
    this.water = new THREE.Mesh(geo, mat);
    this.water.rotation.x = -Math.PI / 2;
    this.water.position.z = -100;
    this.scene.add(this.water);

    // Glowing Lane Lines
    [-4, 0, 4].forEach(x => {
      const lineGeo = new THREE.PlaneGeometry(0.15, 400);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.4 });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.05, -100);
      this.scene.add(line);
    });
  },

  createOrca() {
    this.orcaGroup = new THREE.Group();

    // High Quality Custom Smooth Orca Mesh
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.2, metalness: 0.5 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0f6fc, roughness: 0.3 });

    // Main Body
    const bodyGeo = new THREE.SphereGeometry(1, 32, 16);
    bodyGeo.scale(0.8, 0.7, 2.2);
    const body = new THREE.Mesh(bodyGeo, blackMat);
    this.orcaGroup.add(body);

    // Belly White Patch
    const bellyGeo = new THREE.SphereGeometry(0.95, 32, 16);
    bellyGeo.scale(0.75, 0.4, 1.8);
    const belly = new THREE.Mesh(bellyGeo, whiteMat);
    belly.position.set(0, -0.25, 0.1);
    this.orcaGroup.add(belly);

    // Dorsal Fin
    const finGeo = new THREE.ConeGeometry(0.25, 1.5, 16);
    const dorsal = new THREE.Mesh(finGeo, blackMat);
    dorsal.position.set(0, 1, -0.2);
    dorsal.rotation.x = -0.4;
    this.orcaGroup.add(dorsal);

    // Tail
    const tailGeo = new THREE.BoxGeometry(1.5, 0.08, 0.6);
    this.tail = new THREE.Mesh(tailGeo, blackMat);
    this.tail.position.set(0, 0, -2);
    this.orcaGroup.add(this.tail);

    this.orcaGroup.position.set(0, 0.5, 0);
    this.scene.add(this.orcaGroup);
  },

  spawnObstacle() {
    const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
    const geo = new THREE.BoxGeometry(2, 1.5, 1);
    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xaa0033, roughness: 0.2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(lane, 0.75, -150);
    this.scene.add(mesh);
    this.obstacles.push(mesh);
  },

  spawnCoin() {
    const lane = [-4, 0, 4][Math.floor(Math.random() * 3)];
    const geo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 24);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffb703, metalness: 0.9, roughness: 0.1, emissive: 0xffb703, emissiveIntensity: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.PI / 2;
    mesh.position.set(lane, 1.2, -150);
    this.scene.add(mesh);
    this.coins.push(mesh);
  },

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('keydown', (e) => {
      if (!this.active) return;
      if ((e.key === 'ArrowLeft' || e.key === 'a') && this.lane > -1) this.lane--;
      if ((e.key === 'ArrowRight' || e.key === 'd') && this.lane < 1) this.lane++;
      if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') && !this.isJumping) {
        this.isJumping = true;
        this.jumpVelocity = 0.45;
      }
    });
  },

  start() {
    this.active = true;
    this.score = 0;
    this.distance = 0;
    this.speed = 0.8;
    this.lane = 0;

    // Clear items
    this.obstacles.forEach(o => this.scene.remove(o));
    this.coins.forEach(c => this.scene.remove(c));
    this.obstacles = [];
    this.coins = [];

    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  },

  gameOver() {
    this.active = false;
    document.getElementById('finalStats').textContent = `Distance: ${Math.floor(this.distance)}m | Tokens: ${this.score}`;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  },

  animate() {
    requestAnimationFrame(() => this.animate());

    if (this.active) {
      this.distance += this.speed;
      this.speed += 0.0001; // Progressive speed increase

      // Movement Physics
      this.targetX = this.lane * 4;
      this.orcaGroup.position.x += (this.targetX - this.orcaGroup.position.x) * 0.15;
      
      // Roll animation on turning
      this.orcaGroup.rotation.z = (this.orcaGroup.position.x - this.targetX) * 0.08;

      // Jump Physics
      if (this.isJumping) {
        this.posY += this.jumpVelocity;
        this.jumpVelocity -= 0.025; // Gravity
        if (this.posY <= 0) {
          this.posY = 0;
          this.isJumping = false;
        }
      }
      this.orcaGroup.position.y = 0.5 + this.posY;
      this.orcaGroup.rotation.x = this.isJumping ? this.jumpVelocity * 0.8 : 0;

      // Tail Swim Animation
      this.tail.rotation.y = Math.sin(Date.now() * 0.015) * 0.4;

      // Spawns
      if (Math.random() < 0.03) this.spawnObstacle();
      if (Math.random() < 0.04) this.spawnCoin();

      // Update Obstacles
      for (let i = this.obstacles.length - 1; i >= 0; i--) {
        let o = this.obstacles[i];
        o.position.z += this.speed;

        // Collision Check
        if (Math.abs(o.position.z - this.orcaGroup.position.z) < 1.2 &&
            Math.abs(o.position.x - this.orcaGroup.position.x) < 1.2 &&
            this.posY < 1.0) {
          this.gameOver();
        }

        if (o.position.z > 20) {
          this.scene.remove(o);
          this.obstacles.splice(i, 1);
        }
      }

      // Update Coins
      for (let i = this.coins.length - 1; i >= 0; i--) {
        let c = this.coins[i];
        c.position.z += this.speed;
        c.rotation.z += 0.05;

        // Collect Check
        if (Math.abs(c.position.z - this.orcaGroup.position.z) < 1.5 &&
            Math.abs(c.position.x - this.orcaGroup.position.x) < 1.2) {
          this.score += 10;
          this.scene.remove(c);
          this.coins.splice(i, 1);
        } else if (c.position.z > 20) {
          this.scene.remove(c);
          this.coins.splice(i, 1);
        }
      }

      // Dynamic Camera
      this.camera.position.x = this.orcaGroup.position.x * 0.3;
      this.camera.lookAt(this.orcaGroup.position.x * 0.5, 1.5, -5);

      // HUD updates
      document.getElementById('scoreVal').textContent = this.score;
      document.getElementById('distVal').textContent = Math.floor(this.distance) + 'm';
    }

    this.renderer.render(this.scene, this.camera);
  }
};

window.onload = () => Game.init();
</script>
</body>
</html>
